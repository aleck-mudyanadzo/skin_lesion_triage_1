<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skin Lesion Triage System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top app-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('main.index') }}">
                <i class="bi bi-heart-pulse-fill"></i>
                <span>Skin Lesion Triage</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link text-light d-flex align-items-center gap-1" href="{{ url_for('main.lookup') }}">
                    <i class="bi bi-ticket-perforated"></i>
                    <span class="d-none d-sm-inline">View Past Result</span>
                </a>
                <a class="nav-link text-light d-flex align-items-center gap-1" href="{{ url_for('main.history') }}">
                    <i class="bi bi-clock-history"></i>
                    <span class="d-none d-sm-inline">History</span>
                </a>
                <a class="nav-link text-light d-flex align-items-center gap-1" href="{{ url_for('main.survey') }}">
                    <i class="bi bi-clipboard2-pulse"></i>
                    <span class="d-none d-sm-inline">Usability Survey</span>
                </a>
                <button id="theme-toggle" class="btn btn-sm btn-outline-light rounded-circle" type="button" title="Toggle dark mode">
                    <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="my-0">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer text-center small py-4 mt-5">
        <div class="d-flex justify-content-center align-items-center gap-2 mb-1">
            <i class="bi bi-heart-pulse-fill"></i>
            <span class="fw-semibold">Skin Lesion Triage System</span>
        </div>
        <div class="opacity-75">&copy; 2026. All rights reserved.</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            const root = document.documentElement;
            const toggleBtn = document.getElementById("theme-toggle");
            const icon = document.getElementById("theme-icon");

            function applyTheme(theme) {
                root.setAttribute("data-bs-theme", theme);
                icon.className = theme === "dark" ? "bi bi-sun-fill" : "bi bi-moon-stars-fill";
            }

            let saved = null;
            try { saved = localStorage.getItem("theme"); } catch (e) {}
            const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            applyTheme(saved || preferred);

            toggleBtn.addEventListener("click", function () {
                const current = root.getAttribute("data-bs-theme");
                const next = current === "dark" ? "light" : "dark";
                applyTheme(next);
                try { localStorage.setItem("theme", next); } catch (e) {}
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
